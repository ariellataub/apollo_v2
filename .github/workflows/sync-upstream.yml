name: Sync from upstream

on:
  schedule:
    # Daily at 07:00 UTC (~2-3am ET depending on DST). Picked for low
    # traffic — adjust if you'd rather run at a different time.
    - cron: "0 7 * * *"
  # Lets you click "Run workflow" in the Actions tab to trigger on demand.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/ariellataub/apollo.git
          git fetch upstream main

      - name: Check how far behind upstream we are
        id: check
        run: |
          BEHIND=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          echo "Behind upstream/main by $BEHIND commit(s)."

      - name: Already up to date — nothing to do
        if: steps.check.outputs.behind == '0'
        run: echo "Fork already includes all upstream commits."

      - name: Try a clean merge of upstream/main into main
        id: merge
        if: steps.check.outputs.behind != '0'
        continue-on-error: true
        run: |
          git checkout main
          git merge upstream/main --no-edit \
            -m "Auto-sync ${{ steps.check.outputs.behind }} commit(s) from upstream ariellataub/apollo"

      - name: Push merged main (clean merge → Cloudflare will redeploy)
        if: steps.check.outputs.behind != '0' && steps.merge.outcome == 'success'
        run: git push origin main

      - name: Open / update PR for manual conflict resolution
        if: steps.check.outputs.behind != '0' && steps.merge.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git merge --abort
          BRANCH="sync/upstream"

          EXISTING=$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "PR #$EXISTING already open — leaving it alone. Resolve and merge it; the next sync run will pick up any newer upstream commits."
            exit 0
          fi

          git checkout -B "$BRANCH" upstream/main
          git push origin "$BRANCH" --force

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Sync from upstream — manual resolution needed" \
            --body $'Daily auto-sync from `ariellataub/apollo` could not auto-merge because some files conflict with our Cloudflare/Apollo changes.\n\n**How to resolve from the GitHub UI:**\n1. Click the **Resolve conflicts** button below.\n2. For each file with `<<<<<<<` markers, choose which version to keep (or combine them).\n3. Click **Mark as resolved** on each file.\n4. Click **Commit merge** when done, then **Merge pull request**.\n\nCloudflare will redeploy automatically once the PR is merged.'
